<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهندسات الطاقة: أنقذي المدينة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5f8;--fg:#0f2a2e;--cd:#fff;--bd:#c5d3de;--ac:#0d9488;--onac:#fff;--mu:#4b6168;--am:#b45309;--ok:#16a34a;--no:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b17;--fg:#e8eefc;--cd:#0b1426;--bd:#24304d;--ac:#3de6c8;--onac:#04201e;--mu:#9aa7c2;--am:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050b17;--fg:#e8eefc;--cd:#0b1426;--bd:#24304d;--ac:#3de6c8;--onac:#04201e;--mu:#9aa7c2;--am:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100%}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{margin:6px 0 2px;font-size:27px;font-weight:800}
.sub{margin:0 0 12px;font-size:14.5px;color:var(--mu)}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;margin-bottom:14px}
#sn{font-weight:700;font-size:15.5px}#hs{display:flex;gap:3px}
#sc{background:var(--ac);color:var(--onac);font-weight:800;border-radius:999px;padding:3px 12px;min-width:44px;text-align:center}
.in{font-size:17px;line-height:1.8;margin:6px 0 10px}
.cnt{text-align:center;color:var(--mu);font-size:14.5px;margin:4px 0 14px}
.map{display:flex;flex-direction:column;gap:10px}
.stg{font:inherit;text-align:start;display:flex;align-items:center;gap:12px;background:var(--cd);color:var(--fg);border:1.5px solid var(--bd);border-radius:16px;padding:12px 14px;cursor:pointer;min-height:64px}
.stg b{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center;font-size:18px}
.stg span{flex:1;display:flex;flex-direction:column}.stg strong{font-size:18px}.stg small{color:var(--mu);font-size:14px}
.stg em{font-style:normal;color:var(--am);font-weight:700;font-size:16px}
.stg.dn{border-color:var(--ac)}.stg:disabled{opacity:.5;cursor:default}
.q{font-size:22px;font-weight:800;line-height:1.6;background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:8px 0 14px;text-align:center}
.q small{display:block;font-size:14px;font-weight:500;color:var(--mu);margin-top:4px}
.pg{font-size:14.5px;color:var(--mu);text-align:center}
.opts{display:flex;flex-direction:column;gap:10px}.opts.g3{display:grid;grid-template-columns:1fr 1fr}.opts.g3 .op{padding:14px 6px}
.op,.b{font:inherit;font-size:18px;font-weight:700;color:var(--fg);background:var(--cd);border:1.5px solid var(--bd);border-radius:14px;padding:14px;min-height:52px;cursor:pointer}
.b{background:var(--ac);color:var(--onac);border-color:transparent;width:100%;margin-top:12px}
.op.ok,.op:disabled.ok{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.op.no{background:var(--no);border-color:var(--no);color:#fff;animation:sk .4s}
.op:disabled{opacity:.7}
@keyframes sk{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.mas{display:flex;align-items:center;gap:10px;margin-top:14px}
.bub{flex:1;background:var(--cd);border:1.5px solid var(--ac);border-radius:16px;padding:10px 14px;font-size:16.5px;font-weight:500;animation:pp .35s}
@keyframes pp{from{transform:scale(.85);opacity:0}}
.tb{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:10px 0}.tb i{display:block;height:100%;width:100%;background:var(--am)}
.trk{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:78px;background:var(--cd);border:1.5px dashed var(--bd);border-radius:16px;padding:10px;margin-bottom:14px}
.trk i{font-style:normal;color:var(--ac);font-size:22px;font-weight:800}
.step{display:flex;flex-direction:column;align-items:center;background:var(--ac);color:var(--onac);border-radius:12px;padding:6px 10px;animation:pp .35s}.step small{font-size:12.5px}
.res{text-align:center}.res h2{font-size:26px;margin:14px 0 4px}.stars{font-size:46px;color:var(--am);letter-spacing:6px;animation:pp .6s}
.cert{background:var(--cd);border:2px solid var(--am);border-radius:20px;padding:16px;text-align:center;margin-bottom:14px}.cert h2{margin:0 0 6px;font-size:23px}.cert p{margin:4px 0;font-size:16.5px}
.lit{animation:gl 2s ease-in-out infinite}@keyframes gl{50%{opacity:.6}}
</style>
</head>
<body>
<div id="app">
<h1>مهندسات الطاقة: أنقذي المدينة</h1>
<p class="sub">العلوم · ثاني متوسط · تحولات الطاقة · أ. شذى ابودوشه</p>
<div id="top"><span id="sn"></span><span id="hs"></span><span id="sc">0</span></div>
<main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s),m=$('#main');
const T=['حركية','وضع','حرارية','كيميائية','كهربائية','ضوئية'];
const ST=[
{n:'اعرفي الطاقة',d:'صنّفي كل مثال إلى نوع الطاقة',all:T,qs:[['كرة تتدحرج على الأرض','حركية'],['كتاب موضوع على رف عالٍ','وضع'],['كوب شاي ساخن','حرارية'],['بطارية جديدة غير مستخدمة','كيميائية'],['صاعقة البرق','كهربائية'],['ضوء الشمس','ضوئية']]},
{n:'من أين إلى أين؟',d:'اختاري تحوّل الطاقة في كل جهاز',qs:[['المروحة الكهربائية','كهربائية ← حركية','حركية ← كهربائية','ضوئية ← حرارية'],['اللوح الشمسي','ضوئية ← كهربائية','كهربائية ← ضوئية','حرارية ← حركية'],['سخان الماء الكهربائي','كهربائية ← حرارية','حرارية ← كهربائية','كيميائية ← ضوئية'],['السماعة (مكبّر الصوت)','كهربائية ← صوتية','صوتية ← كهربائية','حرارية ← صوتية'],['بطارية الهاتف أثناء التشغيل','كيميائية ← كهربائية','كهربائية ← كيميائية','ضوئية ← كيميائية']]},
{n:'سلسلة التحولات',d:'رتّبي خطوات تحوّل الطاقة',ch:[
{t:'من الشمس إلى المصباح',s:[['الشمس','ضوئية'],['اللوح الشمسي','يحوّلها إلى كهربائية'],['الأسلاك','كهربائية'],['المصباح','ضوء وحرارة']]},
{t:'من الوقود إلى حركة السيارة',s:[['وقود السيارة','كيميائية'],['احتراق الوقود','حرارية'],['المحرك','يحوّلها إلى حركية'],['حركة السيارة','حركية']]},
{t:'من السد المائي إلى الكهرباء',s:[['ماء مرتفع خلف السد','وضع'],['ماء متدفق','حركية'],['التوربين','حركية دورانية'],['المولّد','كهربائية']]}]},
{n:'أين ضاعت الطاقة؟',d:'الطاقة الضائعة وكفاءة الأجهزة',qs:[['في المصباح المتوهج، أغلب الطاقة الكهربائية تتحول إلى','حرارة','ضوء','صوت'],['أيّ المصباحين أعلى كفاءة؟','مصباح LED','المصباح المتوهج','كلاهما متساويان'],['عند فرك اليدين ببعضهما تتحول الطاقة الحركية إلى','حرارية','كهربائية','ضوئية'],['الطاقة الضائعة من الأجهزة تتحول غالبًا إلى','حرارية غير مفيدة','لا شيء، فهي تفنى','كهربائية إضافية'],['تزيد كفاءة الجهاز كلما','قلّت الطاقة الضائعة','زادت الطاقة الضائعة','زاد حجمه']]},
{n:'الطاقة المتجددة',d:'ميّزي المصادر المتجددة من غيرها',all:['متجددة','غير متجددة'],qs:[['الشمس','متجددة'],['الرياح','متجددة'],['الفحم الحجري','غير متجددة'],['الماء المتدفق في السدود','متجددة'],['النفط','غير متجددة'],['الغاز الطبيعي','غير متجددة'],['حرارة باطن الأرض','متجددة'],['مخلفات النباتات (الكتلة الحيوية)','متجددة']]},
{n:'تحدي القائدة',d:'أسئلة سريعة بوقت محدد',t:12,qs:[['ينص قانون حفظ الطاقة على أن الطاقة','لا تفنى ولا تُستحدث، بل تتحول','تفنى أحيانًا','تُستحدث من العدم'],['اللوح الشمسي يحوّل الطاقة الضوئية إلى','كهربائية','حركية','كيميائية'],['عند سقوط كرة من مكان عالٍ تتحول طاقة الوضع إلى','حركية','ضوئية','صوتية فقط'],['الطاقة الكيميائية في الغذاء تتحول في الجسم إلى','حركية وحرارية','نووية','ضوئية فقط'],['أي مما يلي مصدر متجدد للطاقة؟','الرياح','الفحم','النفط'],['في البطارية تتحول الطاقة الكيميائية إلى','كهربائية','حركية','ضوئية']]}];
const PR=['أحسنتِ!','ممتاز!','إجابة رائعة!','أنتِ مهندسة حقيقية!'];
const S={sc:0,dn:[0,0,0,0,0,0],sr:[0,0,0,0,0,0],st:-1,h:3,qi:0,ci:0,pl:0,lk:0};let tm=null;
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const MAS='<svg width="52" height="62" viewBox="0 0 54 64" aria-hidden="true"><rect x="19" y="2" width="16" height="8" rx="3" fill="#fbbf24"/><rect x="6" y="8" width="42" height="54" rx="12" fill="#fbbf24"/><path d="M29 12l-7 10h6l-2 8 9-12h-6z" fill="#fff"/><circle cx="20" cy="38" r="4.5" fill="#1b1300"/><circle cx="34" cy="38" r="4.5" fill="#1b1300"/><path d="M19 49q8 7 16 0" stroke="#1b1300" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
const mas=t=>`<div class="mas">${MAS}<div class="bub">${t}</div></div>`;
const HT=n=>[0,1,2].map(i=>`<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z" fill="${i<n?'#ef4444':'var(--bd)'}"/></svg>`).join('');
function bar(){$('#hs').innerHTML=HT(S.h);$('#sc').textContent=S.sc;$('#sn').textContent=S.st<0?'خريطة المدينة':'المرحلة '+(S.st+1)+': '+ST[S.st].n}
function city(){const hh=[62,92,72,104,78,88];let s='';hh.forEach((h,i)=>{const x=8+(5-i)*58,y=118-h,on=S.dn[i];s+=`<rect x="${x}" y="${y}" width="48" height="${h}" rx="4" fill="var(--cd)" stroke="var(--bd)"/>`;for(let r=0;r<Math.floor((h-12)/20);r++)for(let c=0;c<2;c++)s+=`<rect x="${x+9+c*20}" y="${y+10+r*20}" width="10" height="12" rx="2" fill="${on?'#fbbf24':'var(--bd)'}"${on?' class="lit"':''}/>`});return `<svg viewBox="0 0 360 122" width="100%" role="img" aria-label="مباني المدينة"><rect x="0" y="118" width="360" height="4" fill="var(--bd)"/>${s}</svg>`}
function cert(){const t=S.sr.reduce((a,b)=>a+b,0),b=t>=16?'مهندسة الطاقة الأولى':t>=11?'خبيرة الطاقة':'مستكشفة الطاقة';return `<div class="cert"><h2>أضأتِ المدينة بالكامل!</h2><p>لقبك: <b>${b}</b></p><p>النجوم ${t} من 18 · النقاط ${S.sc}</p><button class="b" data-a="reset">العبي من جديد</button></div>`}
function home(){clearInterval(tm);S.st=-1;S.h=3;const n=S.dn.filter(Boolean).length;
m.innerHTML=`<p class="in">انقطعت الكهرباء عن المدينة! أنتِ مهندسة الطاقة، أنجزي المراحل لتضيء المباني واحدًا بعد الآخر.</p>${city()}<p class="cnt">المباني المضاءة: ${n} من 6</p>${n==6?cert():''}<div class="map">`+ST.map((s,i)=>{const lk=i>0&&!S.dn[i-1];return `<button class="stg${S.dn[i]?' dn':''}" data-i="${i}"${lk?' disabled':''}><b>${i+1}</b><span><strong>${s.n}</strong><small>${s.d}</small></span><em>${S.dn[i]?'★'.repeat(S.sr[i]):lk?'مغلقة':''}</em></button>`}).join('')+'</div>';bar()}
function start(i){S.st=i;S.h=3;S.qi=0;S.ci=0;S.lk=0;ST[i].ch?chain():quiz()}
function quiz(){const st=ST[S.st];if(S.qi>=st.qs.length)return fin(1);const q=st.qs[S.qi],o=st.all?st.all.map(t=>[t,t==q[1]]):sh(q.slice(1).map((t,i)=>[t,i==0]));
m.innerHTML=`<div class="pg">سؤال ${S.qi+1} من ${st.qs.length}</div>${st.t?'<div class="tb"><i id="tf"></i></div>':''}<div class="q">${q[0]}</div><div class="opts${st.all&&st.all.length>2?' g3':''}">${o.map(x=>`<button class="op" data-ok="${x[1]?1:0}">${x[0]}</button>`).join('')}</div><div id="fb"></div>`;bar();
if(st.t){let l=st.t;const f=$('#tf');tm=setInterval(()=>{l-=.1;f.style.width=Math.max(0,l/st.t*100)+'%';if(l<=0){clearInterval(tm);res(null)}},100)}}
function res(b){clearInterval(tm);if(S.lk)return;S.lk=1;const ok=!!b&&b.dataset.ok==1;
document.querySelectorAll('.op').forEach(x=>{x.disabled=true;if(x.dataset.ok==1)x.classList.add('ok')});
if(b&&!ok)b.classList.add('no');if(ok)S.sc+=10;else S.h--;bar();
$('#fb').innerHTML=mas(ok?sh(PR)[0]:(b?'ليست الصحيحة، والإجابة الصحيحة باللون الأخضر':'انتهى الوقت!'));
setTimeout(()=>{S.lk=0;if(S.h<=0)return fin(0);S.qi++;quiz()},1400)}
function chain(){const st=ST[S.st];if(S.ci>=st.ch.length)return fin(1);const c=st.ch[S.ci];S.pl=0;
m.innerHTML=`<div class="pg">سلسلة ${S.ci+1} من ${st.ch.length}</div><div class="q">${c.t}<small>اضغطي الخطوات بالترتيب الصحيح</small></div><div id="trk" class="trk"></div><div class="opts">${sh(c.s.map((x,i)=>[x,i])).map(([x,i])=>`<button class="op ch" data-i="${i}">${x[0]}</button>`).join('')}</div><div id="fb"></div>`;bar()}
function chk(b){if(S.lk)return;const c=ST[S.st].ch[S.ci],i=+b.dataset.i;
if(i==S.pl){b.disabled=true;b.classList.add('ok');S.sc+=10;$('#trk').insertAdjacentHTML('beforeend',(S.pl?'<i>←</i>':'')+`<span class="step"><b>${c.s[i][0]}</b><small>${c.s[i][1]}</small></span>`);S.pl++;bar();
if(S.pl==c.s.length){S.lk=1;$('#fb').innerHTML=mas('سلسلة صحيحة!');setTimeout(()=>{S.lk=0;S.ci++;chain()},1500)}}
else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),500);S.h--;bar();$('#fb').innerHTML=mas('ليست الخطوة التالية، فكّري من أين بدأت الطاقة');if(S.h<=0){S.lk=1;setTimeout(()=>{S.lk=0;fin(0)},1000)}}}
function fin(w){clearInterval(tm);
if(w){S.dn[S.st]=1;S.sr[S.st]=Math.max(S.sr[S.st],S.h);S.sc+=20*S.h;m.innerHTML=`<div class="res"><h2>أحسنتِ! أنجزتِ المرحلة</h2><div class="stars">${'★'.repeat(S.h)}${'☆'.repeat(3-S.h)}</div><p>أضأتِ مبنى جديدًا في المدينة، ومكافأتك ${20*S.h} نقطة.</p>${mas('أنتِ مهندسة طاقة رائعة!')}<button class="b" data-a="home">العودة للخريطة</button></div>`}
else m.innerHTML=`<div class="res"><h2>انتهت القلوب</h2><p>لا بأس، المهندسات الشاطرات يجرّبن مرة أخرى.</p>${mas('راجعي الدرس وحاولي من جديد')}<button class="b" data-a="retry">إعادة المرحلة</button><button class="op" style="width:100%;margin-top:10px" data-a="home">العودة للخريطة</button></div>`;bar()}
m.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.classList.contains('stg'))start(+b.dataset.i);
else if(b.classList.contains('ch'))chk(b);
else if(b.classList.contains('op')&&b.dataset.ok!==undefined)res(b);
else if(b.dataset.a=='home')home();
else if(b.dataset.a=='retry')start(S.st);
else if(b.dataset.a=='reset'){S.dn.fill(0);S.sr.fill(0);S.sc=0;home()}};
home();
</script>
</body>
</html>
